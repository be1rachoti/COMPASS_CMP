# CI: push -> lint -> format -> types -> unit -> integration -> security -> image.
#
# Two things this pipeline does that a default one does not:
#
# 1. **It runs the integration tests against a real PostgreSQL.** The constraints
#    in migration 0002 are the enforcement layer; testing them against a mock
#    tests the mock. The empty-array CHECK bug fixed in 0004 was only findable
#    against a real database.
#
# 2. **It exercises the migrations in both directions.** `upgrade -> downgrade ->
#    upgrade` proves the rollback path works *before* it is needed at 2am, which
#    is the only time anyone finds out otherwise.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen: fail if uv.lock does not match pyproject.toml, rather than
      # resolving something nobody has tested.
      - name: Install
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests migrations scripts --output-format=github

      - name: Format check
        run: uv run ruff format --check src tests migrations scripts

      - name: Type check
        run: uv run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmp
          POSTGRES_USER: cmp
          POSTGRES_PASSWORD: cmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmp -d cmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cmp
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-secret-key-at-least-thirty-two-bytes
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      # The rollback path, exercised on every commit rather than discovered
      # during an incident.
      - name: Migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      - name: Full suite with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan it

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-extras --dev

      # Known CVEs in the locked dependency set.
      - name: Audit dependencies
        run: uv run pip-audit --strict --desc

      # Bandit rules are already part of ruff's `S` selection, so this step is
      # the belt to that pipeline's braces rather than a duplicate.
      - name: Static security scan
        run: uv run ruff check src --select S --output-format=github

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build and scan the image
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cmp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A vulnerable base image is a vulnerable deployment, however clean the
      # application code is.
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cmp-api:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      # The image must actually start. A build that succeeds and a container
      # that exits on boot is a green pipeline and a broken deploy.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e ENVIRONMENT=local \
            -e POSTGRES_HOST=nowhere \
            cmp-api:${{ github.sha }} \
            gunicorn cmp.main:app --worker-class uvicorn.workers.UvicornWorker \
              --bind 0.0.0.0:8000 --workers 1 --timeout 30 || true
          sleep 5
          # Startup is fail-fast without a database, which is the intended
          # behaviour: confirm it exited rather than serving 503s silently.
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke || true
