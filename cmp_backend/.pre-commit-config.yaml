# Fast checks only. A pre-commit hook that takes thirty seconds is a hook people
# start bypassing with --no-verify, and a bypassed hook protects nothing.
# The full suite runs in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      # A private key in history stays in history.
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Runs on the whole package rather than changed files: mypy needs the
      # import graph, and checking one file in isolation misses the errors that
      # matter.
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-unit
        name: unit tests
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        types: [python]
