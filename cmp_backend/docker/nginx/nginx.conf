# Nginx as the TLS and reverse-proxy layer.
#
# What lives here rather than in the application, and why:
#
# * **TLS termination and HSTS.** The application should not hold private keys.
# * **Body size limits.** Rejected before a byte reaches Python. The application
#   enforces the same cap independently, because it is also reachable directly.
# * **Rate limiting on the public surface.** Cheaper here than after routing, and
#   it protects the application from load it would otherwise have to absorb.
# * **Access-log scrubbing for /c/{token}.** A consent link is a capability.
#   Anything that can read the access log could otherwise impersonate the link.

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------- logging
    # The request id issued by the application is echoed back in a header; log it
    # so a line here can be joined to the application's line for the same request.
    log_format main escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$upstream_http_x_request_id",'
        '"user_agent":"$http_user_agent"}';

    # $uri, not $request: $request carries the query string, and the consent
    # token lives in the path anyway - see the /c/ location below.
    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------- transport
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Never advertise the version. It tells a scanner which CVEs to try.
    server_tokens off;

    # --------------------------------------------------------------- limits
    # Matches settings.max_upload_bytes. Both exist: this stops the bytes at the
    # edge, and the application stops them if the proxy is bypassed.
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    # ---------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml;

    # --------------------------------------------------------- rate limits
    # Keyed by address on the public surface only; everything else relies on
    # session auth. The zones mirror the caps in the API reference §1.6, with
    # burst allowances so a legitimate page load is never the thing that trips.
    limit_req_zone $binary_remote_addr zone=public:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:20m rate=600r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream cmp_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # ----------------------------------------------------- HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # The health check must answer over plain HTTP: a load balancer probing
        # before certificates are in place should not see a redirect.
        location = /health {
            proxy_pass http://cmp_api;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------- HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 and 1.3 only. Everything below 1.2 has known breaks.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;   # let 1.3 clients choose; they choose well
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;         # tickets weaken forward secrecy
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_conn conn 40;

        # ------------------------------------------------- proxy defaults
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: the application trusts this header in
        # production, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Explicit and finite. An unbounded read timeout turns one slow query
        # into an exhausted connection pool.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

        # ------------------------------------------------------- routing
        location = /health {
            proxy_pass http://cmp_api;
            access_log off;
        }

        location = /ready {
            proxy_pass http://cmp_api;
            access_log off;
        }

        # Metrics are for the scraper, not the internet.
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://cmp_api;
            access_log off;
        }

        # The public consent flow. The token is a capability, so it is scrubbed
        # from the access log; without this, log access becomes link access.
        location ~ ^/c/ {
            limit_req zone=public burst=20 nodelay;
            access_log /var/log/nginx/public.log main;
            set $loggable_uri "/c/[token]";
            proxy_pass http://cmp_api;
            proxy_set_header Referrer-Policy "no-referrer";
        }

        # Authentication endpoints get the tightest limit. The application also
        # enforces per-account lockout, which an address-based limit cannot.
        location ~ ^/auth/(login|otp|password) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://cmp_api;
        }

        # Uploads: approval proof and import manifests. Buffering to disk keeps a
        # 25 MB upload out of the worker's memory.
        location ~ ^/(imports|projects/[^/]+/approvals) {
            limit_req zone=general burst=20;
            client_body_in_file_only clean;
            client_body_temp_path /var/cache/nginx/uploads 1 2;
            proxy_request_buffering on;
            proxy_pass http://cmp_api;
        }

        # Exports stream a file; buffering the whole thing helps nobody.
        location ~ ^/exports/[^/]+/download {
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://cmp_api;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://cmp_api;
        }
    }
}
