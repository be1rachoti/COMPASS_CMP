[project]
name = "cmp-backend"
version = "0.1.0"
description = "Consent Management Platform — DPDP Act 2023 / DPDP Rules 2025 consent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17",
    "argon2-cffi>=25.1",
    "celery[redis]>=5.5",
    "email-validator>=2.3",
    "fastapi[standard]>=0.121",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "orjson>=3.11",
    "prometheus-fastapi-instrumentator>=7.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "pyjwt[crypto]>=2.11",
    "python-multipart>=0.0.20",
    "redis>=6.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.40",
]

[dependency-groups]
dev = [
    "anyio>=4.11",
    "faker>=38.0",
    "mypy>=1.19",
    "pip-audit>=2.9",
    "pre-commit>=4.4",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cmp"
module-root = "src"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — every timestamp in this system is tz-aware
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
    "ASYNC",
    "S",         # bandit
]
ignore = [
    "S101",    # assert - used in tests, and for RETURNING invariants
    "B008",    # FastAPI Depends() in a default is the documented idiom
    # Our domain exceptions are named for what happened, not suffixed "Error":
    # `raise NotFound("Project")` reads better at the call site than
    # `raise NotFoundError(...)`, and they are never caught as generic errors.
    "N818",
    # Pydantic's generic support does not yet cover PEP 695 type parameters, so
    # Page[T] must remain Generic[T].
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# S105 flags the audit event vocabulary ("auth.password_changed") as a hardcoded
# password. It is a constant naming an event type, not a credential.
"src/cmp/domain/audit/service.py" = ["S105"]

# S608 flags f-string SQL. In the repository layer every interpolated fragment is
# built from validated identifiers - a sort column checked against a per-route
# allow-list, a scope predicate chosen by an enum - and every *value* is bound as
# a parameter. Suppressed per-directory rather than globally so the rule still
# protects the service and API layers, where no SQL should appear at all.
"src/cmp/db/repositories/*" = ["S608"]
"src/cmp/db/sql.py" = ["S608"]
# The dashboard composes the projects repository's scope predicate rather than
# restating it, so it interpolates the same code-controlled fragment the
# repository does. Values stay bound as parameters.
"src/cmp/api/routers/v1/dashboard.py" = ["S608"]

"tests/*" = ["S105", "S106", "S311", "S608"]

# The operator scripts are command-line tools. `print` and `sys.stdout.write` are
# their entire user interface, so T201 is not a finding there — a structured log
# line is the wrong medium for "here are the seeded accounts".
"scripts/*" = ["T201"]
# The GRANT statements interpolate a role *name*, because GRANT accepts no bind
# parameter. It comes from a module constant or an operator-set environment
# variable - never a request - and PL/pgSQL's format(%I) quotes it as an
# identifier. See the module docstring.
"migrations/*" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["cmp"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "slowapi.*", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

# Celery's decorators are untyped upstream, so every task and signal handler is
# reported as "untyped decorator makes function untyped". That is a fact about
# Celery, not about this code: the task bodies are still checked. Narrowed to the
# tasks package so the rest of the codebase keeps strict decorator checking.
[[tool.mypy.overrides]]
module = ["cmp.tasks.*"]
disallow_untyped_decorators = false
warn_return_any = false

# redis-py annotates one class for both the sync and async clients, so every
# await sees `Awaitable[T] | T` and mypy cannot narrow it. Casting at ~40 call
# sites would add noise without adding safety, so the two modules that talk to
# Redis directly relax exactly these checks. Everything above them - the services
# and routes that consume their return values - stays strict.
[[tool.mypy.overrides]]
module = [
    "cmp.auth.sessions.service",
    "cmp.auth.rate_limit.service",
    "cmp.auth.authentication.otp",
    "cmp.db.redis",
]
disable_error_code = ["misc", "no-any-return", "no-untyped-call", "type-arg", "arg-type"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL and Redis (docker compose up db redis)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/cmp"]
branch = true
omit = ["*/tasks/worker.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
